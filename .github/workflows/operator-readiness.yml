name: Installed operator readiness

on:
  push:
    branches: [main]
    tags: ['**']
    paths:
      - 'src/ciw/**'
      - 'tests/test_operator*.py'
      - 'scripts/check_operator_installed.py'
      - 'pyproject.toml'
      - 'examples/curved-path-study/baseline.json'
      - 'instruments/manifest.json'
      - '.github/workflows/operator-readiness.yml'
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_operator*.py'
      - 'scripts/check_operator_installed.py'
      - 'pyproject.toml'
      - 'examples/curved-path-study/baseline.json'
      - 'instruments/manifest.json'
      - '.github/workflows/operator-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  installed-journey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable retained Windows source paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test and wheel build dependencies
        run: python -m pip install 'setuptools>=77' wheel '.[dev]'
      - name: Operator contracts and refusal checks
        run: python -m pytest -q tests/test_operator_catalog.py tests/test_operator_doctor.py tests/test_operator_start.py tests/test_operator_provision.py tests/test_operator_workbench.py --junitxml=operator-tests.xml
      - name: Build regular wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Isolated installed journey and retained public provider
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd()
          environment = Path(os.environ['RUNNER_TEMP']) / 'operator-environment'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
          installed_python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheels = list((root / 'dist').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected one built wheel')
          subprocess.run([str(installed_python), '-m', 'pip', 'install', str(wheels[0])], check=True)
          output = Path(os.environ['RUNNER_TEMP']) / 'operator-readiness'
          subprocess.run([str(installed_python), str(root / 'scripts/check_operator_installed.py'),
                          '--output-dir', str(output), '--monorepo', str(root)],
                         cwd=Path(os.environ['RUNNER_TEMP']), check=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-readiness-${{ matrix.os }}
          path: |
            operator-tests.xml
            dist/*.whl
            ${{ runner.temp }}/operator-readiness/qualification.json
            ${{ runner.temp }}/operator-readiness/commands/**
            ${{ runner.temp }}/operator-readiness/workbench-*.log
            ${{ runner.temp }}/operator-readiness/first-use/**
            ${{ runner.temp }}/operator-readiness/blocked-first-use/**
            ${{ runner.temp }}/operator-readiness/workbench/*.json
            ${{ runner.temp }}/operator-readiness/curved-source.json
            ${{ runner.temp }}/operator-readiness/curved-original/**
            ${{ runner.temp }}/operator-readiness/curved-replay/**
            ${{ runner.temp }}/operator-readiness/public-providers/*.json
          if-no-files-found: error
          retention-days: 14
