name: Publish preserved native instrument histories
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/publish-source-retirement.yml'
      - 'delivery/source-retirement/**'
permissions: {}
concurrency:
  group: publish-native-source-retirement-20261003
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'atomtrapping/Notations-Systems-Terminal' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'transfer/source-retirement-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the declared Terminal test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Publish only the checksum-bound native feature branch
        run: python delivery/source-retirement/publish.py
